[project]
name = "kb"
version = "1.6.0"
description = "Browse and search every keybinding on your machine, read live from your configs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vijay Gupta" }]
dependencies = []  # stdlib only, on purpose

[project.urls]
Homepage = "https://github.com/vijayet1/kb"
Source = "https://github.com/vijayet1/kb"
Changelog = "https://github.com/vijayet1/kb/blob/main/CHANGELOG.md"

[project.scripts]
kb = "kb.cli:run"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
source-exclude = ["**/.mypy_cache/**", "**/.ruff_cache/**", "**/__pycache__/**"]
wheel-exclude = ["**/.mypy_cache/**", "**/.ruff_cache/**", "**/__pycache__/**"]

[dependency-groups]
dev = ["ruff>=0.17", "mypy>=1.13"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S", "C4", "PIE", "RET", "PL", "RUF", "PTH", "ARG", "TRY", "A", "N", "I"]
ignore = [
    "RUF001", "RUF002",  # the tool is full of intentional key glyphs: ⌘ ⌥ ⇧ ⌃ ⎋ × –
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity/magic-number heuristics; tracked as follow-up refactors
    "TRY003",            # long messages in raise are fine for a CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLC0415", "ARG", "PTH", "N"]
"scripts/*" = ["S603", "S607"]  # release helper shells out to git/uv with fixed arguments

[tool.mypy]
cache_dir = ".mypy_cache"  # repo root, never inside the package (it would end up in the wheel)
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
