[project]
name = "kb"
version = "1.4.1"
description = "Browse and search every keybinding on your machine, read live from your configs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # stdlib only, on purpose

[project.scripts]
kb = "kb.cli:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
